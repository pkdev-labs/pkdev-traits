name: PkDev Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  tests:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: [ '8.4', '8.5' ]

    name: PHP ${{ matrix.php-version }}

    steps:
    - uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: openssl
        coverage: pcov

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v6
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.json') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php-version }}-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run test suite with coverage
      run: vendor/bin/phpunit --coverage-clover=coverage.xml --coverage-text

    - name: Enforce 100% line coverage
      run: |
        php -r '
          $xml = simplexml_load_file("coverage.xml");
          $m = $xml->project->metrics;
          $covered = (int) $m["coveredstatements"];
          $total = (int) $m["statements"];
          $pct = $total ? ($covered / $total) * 100 : 100;
          printf("Line coverage: %.2f%% (%d/%d)\n", $pct, $covered, $total);
          if ($pct < 100) { fwrite(STDERR, "Coverage is below 100%\n"); exit(1); }
        '

    - name: Upload coverage to Codecov
      if: matrix.php-version == '8.5'
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
